name: Rivendell Council Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  council:
    name: Convene the Council
    uses: sylvainsf/rivendell_council/.github/workflows/council.yml@main
    permissions:
      contents: read        # read the repository
      pull-requests: write  # post the review comment
      models: read          # call GitHub Models (via actions/ai-inference)
    with:
      model: openai/gpt-4o
      # Other model options:
      #   anthropic/claude-sonnet-4.6
      #   openai/gpt-5.4
      #   openai/gpt-4o-mini   (faster, cheaper)
      # max-diff-chars: 30000
