name: 'Rivendell Council'
description: >
  Convene the Rivendell Council — a fellowship of AI reviewers (Elrond, Gimli, Aragorn, Legolas)
  led by Gandalf the arbiter — to review a pull request and deliver a PASS/FAIL verdict.
  Powered by GitHub Models via actions/ai-inference — no external API keys required.

  NOTE: For parallel council member reviews, use the reusable workflow instead:
    uses: sylvainsf/rivendell_council/.github/workflows/council.yml@main
  This composite action runs reviews sequentially, which is simpler but slower.

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token with models:read and pull-requests:write permissions.'
    required: true
    default: ${{ github.token }}
  council-config:
    description: >
      Path to a council.md configuration file. If not set, the bundled default is used.
    required: false
    default: ''
  model:
    description: >
      GitHub Models model identifier (e.g. openai/gpt-4o, anthropic/claude-sonnet-4.6,
      openai/gpt-5.4). If set, overrides the model in council.md.
    required: false
    default: ''
  max-diff-chars:
    description: 'Maximum number of characters from the PR diff to send to each reviewer.'
    required: false
    default: '30000'

outputs:
  decision:
    description: "Gandalf's final verdict: PASS or FAIL."
    value: ${{ steps.post.outputs.decision }}
  summary:
    description: "A prose summary of the council's findings."
    value: ${{ steps.post.outputs.summary }}

runs:
  using: 'composite'
  steps:
    # ── Parse config ─────────────────────────────────────────────────────
    - name: Parse council config
      id: config
      shell: bash
      run: |
        CONFIG="${{ inputs.council-config }}"
        if [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
          echo "Using custom config: $CONFIG"
          bash "${{ github.action_path }}/scripts/parse-config.sh" "$CONFIG"
        else
          echo "Using bundled default config"
          bash "${{ github.action_path }}/scripts/parse-config.sh" "${{ github.action_path }}/council.md"
        fi

    - name: Resolve model
      id: resolve-model
      shell: bash
      run: |
        INPUT_MODEL="${{ inputs.model }}"
        CONFIG_MODEL="${{ steps.config.outputs.model }}"
        if [ -n "$INPUT_MODEL" ]; then
          echo "model=$INPUT_MODEL" >> "$GITHUB_OUTPUT"
        else
          echo "model=$CONFIG_MODEL" >> "$GITHUB_OUTPUT"
        fi

    # ── Fetch PR diff ────────────────────────────────────────────────────
    - name: Fetch PR diff
      id: diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
          -H "Accept: application/vnd.github.v3.diff" \
          | head -c "${{ inputs.max-diff-chars }}" > "$RUNNER_TEMP/diff.patch"
        echo "🧙 Fetched diff for PR #$PR_NUMBER ($(wc -c < "$RUNNER_TEMP/diff.patch" | tr -d ' ') bytes)"

    # ── Review each enabled member sequentially ──────────────────────────
    - name: Run council reviews
      shell: bash
      env:
        MEMBERS: ${{ steps.config.outputs.members }}
        WEIGHTS: ${{ steps.config.outputs.weights }}
        MODEL: ${{ steps.resolve-model.outputs.model }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "🧙 The Rivendell Council is assembling…"
        echo "$MEMBERS" | jq -r '.[]' | while IFS= read -r member; do
          member_lower=$(echo "$member" | tr '[:upper:]' '[:lower:]')
          mkdir -p "$RUNNER_TEMP/reviews/$member_lower"

          PROMPT_FILE="$ACTION_PATH/council/${member}.md"
          if [ ! -f "$PROMPT_FILE" ]; then
            echo "  ⚠️  No prompt file for $member — skipping"
            continue
          fi

          # Build prompt file
          {
            cat "$PROMPT_FILE"
            printf '\n\n---\n\nReview the following pull request diff. '
            printf 'Respond with a JSON object containing: '
            printf '"score" (integer 1-10), "summary" (string), '
            printf '"concerns" (array of strings), "suggestions" (array of strings). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n\n'
            cat "$RUNNER_TEMP/diff.patch"
          } > "$RUNNER_TEMP/prompt-${member_lower}.txt"

          echo "  📜 $member prompt ready"
        done

    # Run inference for each member — we use a loop of ai-inference calls.
    # Unfortunately composite actions can't loop over steps, so we use the
    # config to determine which members to call and invoke them all.
    # For true parallel execution, use the reusable workflow instead.

    - name: Identify members
      id: members
      shell: bash
      env:
        MEMBERS: ${{ steps.config.outputs.members }}
      run: |
        # Export individual member flags for conditional steps
        for m in Elrond Gimli Aragorn Legolas Bilbo; do
          m_lower=$(echo "$m" | tr '[:upper:]' '[:lower:]')
          if echo "$MEMBERS" | jq -e --arg n "$m" 'index($n) != null' > /dev/null 2>&1; then
            echo "${m_lower}=true" >> "$GITHUB_OUTPUT"
          else
            echo "${m_lower}=false" >> "$GITHUB_OUTPUT"
          fi
        done

    # ── Elrond ───────────────────────────────────────────────────────────
    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.members.outputs.elrond == 'true' }}
      id: elrond
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/prompt-elrond.txt

    - name: Save Elrond review
      if: ${{ steps.members.outputs.elrond == 'true' }}
      shell: bash
      env:
        REVIEW: ${{ steps.elrond.outputs.response }}
      run: |
        mkdir -p "$RUNNER_TEMP/reviews/elrond"
        if printf '%s' "$REVIEW" | jq . > "$RUNNER_TEMP/reviews/elrond/review.json" 2>/dev/null; then
          echo "  🌟 Elrond review parsed"
        else
          jq -n --arg raw "$REVIEW" '{"score":5,"summary":"Parse error","concerns":[],"suggestions":[],"raw_response":$raw}' \
            > "$RUNNER_TEMP/reviews/elrond/review.json"
        fi

    # ── Gimli ────────────────────────────────────────────────────────────
    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.members.outputs.gimli == 'true' }}
      id: gimli
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/prompt-gimli.txt

    - name: Save Gimli review
      if: ${{ steps.members.outputs.gimli == 'true' }}
      shell: bash
      env:
        REVIEW: ${{ steps.gimli.outputs.response }}
      run: |
        mkdir -p "$RUNNER_TEMP/reviews/gimli"
        if printf '%s' "$REVIEW" | jq . > "$RUNNER_TEMP/reviews/gimli/review.json" 2>/dev/null; then
          echo "  ⚔️ Gimli review parsed"
        else
          jq -n --arg raw "$REVIEW" '{"score":5,"summary":"Parse error","concerns":[],"suggestions":[],"raw_response":$raw}' \
            > "$RUNNER_TEMP/reviews/gimli/review.json"
        fi

    # ── Aragorn ──────────────────────────────────────────────────────────
    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.members.outputs.aragorn == 'true' }}
      id: aragorn
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/prompt-aragorn.txt

    - name: Save Aragorn review
      if: ${{ steps.members.outputs.aragorn == 'true' }}
      shell: bash
      env:
        REVIEW: ${{ steps.aragorn.outputs.response }}
      run: |
        mkdir -p "$RUNNER_TEMP/reviews/aragorn"
        if printf '%s' "$REVIEW" | jq . > "$RUNNER_TEMP/reviews/aragorn/review.json" 2>/dev/null; then
          echo "  👑 Aragorn review parsed"
        else
          jq -n --arg raw "$REVIEW" '{"score":5,"summary":"Parse error","concerns":[],"suggestions":[],"raw_response":$raw}' \
            > "$RUNNER_TEMP/reviews/aragorn/review.json"
        fi

    # ── Legolas ──────────────────────────────────────────────────────────
    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.members.outputs.legolas == 'true' }}
      id: legolas
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/prompt-legolas.txt

    - name: Save Legolas review
      if: ${{ steps.members.outputs.legolas == 'true' }}
      shell: bash
      env:
        REVIEW: ${{ steps.legolas.outputs.response }}
      run: |
        mkdir -p "$RUNNER_TEMP/reviews/legolas"
        if printf '%s' "$REVIEW" | jq . > "$RUNNER_TEMP/reviews/legolas/review.json" 2>/dev/null; then
          echo "  🏹 Legolas review parsed"
        else
          jq -n --arg raw "$REVIEW" '{"score":5,"summary":"Parse error","concerns":[],"suggestions":[],"raw_response":$raw}' \
            > "$RUNNER_TEMP/reviews/legolas/review.json"
        fi

    # ── Bilbo ────────────────────────────────────────────────────────────
    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.members.outputs.bilbo == 'true' }}
      id: bilbo
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/prompt-bilbo.txt

    - name: Save Bilbo review
      if: ${{ steps.members.outputs.bilbo == 'true' }}
      shell: bash
      env:
        REVIEW: ${{ steps.bilbo.outputs.response }}
      run: |
        mkdir -p "$RUNNER_TEMP/reviews/bilbo"
        if printf '%s' "$REVIEW" | jq . > "$RUNNER_TEMP/reviews/bilbo/review.json" 2>/dev/null; then
          echo "  🍃 Bilbo review parsed"
        else
          jq -n --arg raw "$REVIEW" '{"score":5,"summary":"Parse error","concerns":[],"suggestions":[],"raw_response":$raw}' \
            > "$RUNNER_TEMP/reviews/bilbo/review.json"
        fi

    # ── Gandalf ──────────────────────────────────────────────────────────
    - name: Build Gandalf prompt
      shell: bash
      env:
        WEIGHTS: ${{ steps.config.outputs.weights }}
      run: |
        {
          cat "${{ github.action_path }}/council/Gandalf.md"
          printf '\n\n---\n\nHere is the pull request diff under review:\n\n'
          cat "$RUNNER_TEMP/diff.patch"
          printf '\n\n---\n\nHere are the council members'"'"' reviews (with weights):\n\n'
          for dir in "$RUNNER_TEMP"/reviews/*/; do
            [ -d "$dir" ] || continue
            member=$(basename "$dir")
            [ -f "$dir/review.json" ] || continue
            weight=$(echo "$WEIGHTS" | jq -r --arg m "$member" '.[$m] // 1.0' 2>/dev/null || echo "1.0")
            echo "### $member (weight: $weight)"
            cat "$dir/review.json"
            echo ""
          done
          printf '\nDeliver your final verdict. Respond with a JSON object containing: '
          printf '"verdict" ("PASS" or "FAIL"), "summary" (string), '
          printf '"reasoning" (string), "feedback" (string). '
          printf 'Respond with valid JSON only — no markdown fences, no commentary.\n'
        } > "$RUNNER_TEMP/gandalf-prompt.txt"

    - uses: actions/ai-inference@b81b2afb8390ee6839b494a404766bef6493c7d9 # v1
      if: ${{ steps.config.outputs.gandalf == 'true' }}
      id: gandalf
      with:
        model: ${{ steps.resolve-model.outputs.model }}
        prompt-file: ${{ runner.temp }}/gandalf-prompt.txt

    - name: Save AI verdict
      if: ${{ steps.config.outputs.gandalf == 'true' }}
      shell: bash
      env:
        VERDICT: ${{ steps.gandalf.outputs.response }}
      run: |
        if printf '%s' "$VERDICT" | jq . > "$RUNNER_TEMP/verdict.json" 2>/dev/null; then
          echo "  🧙 Gandalf verdict parsed"
        else
          jq -n --arg raw "$VERDICT" \
            '{"verdict":"FAIL","summary":"Verdict could not be parsed.","reasoning":"Parse error","feedback":"Check Actions logs.","raw_response":$raw}' \
            > "$RUNNER_TEMP/verdict.json"
        fi

    - name: Compute weighted-average verdict (no Gandalf)
      if: ${{ steps.config.outputs.gandalf != 'true' }}
      shell: bash
      env:
        WEIGHTS: ${{ steps.config.outputs.weights }}
        THRESHOLD: ${{ steps.config.outputs.threshold }}
      run: |
        result=$(python3 -c "
        import json, glob
        weights = json.loads('$WEIGHTS')
        total_w = 0.0
        weighted_sum = 0.0
        for f in sorted(glob.glob('$RUNNER_TEMP/reviews/*/review.json')):
            member = f.split('/')[-2]
            with open(f) as fh:
                r = json.load(fh)
            w = weights.get(member, 1.0)
            s = float(r.get('score', 5))
            weighted_sum += s * w
            total_w += w
        avg = weighted_sum / total_w if total_w else 5.0
        threshold = float('$THRESHOLD')
        verdict = 'PASS' if avg >= threshold else 'FAIL'
        obj = {
            'verdict': verdict,
            'summary': f'Weighted-average score: {avg:.1f}/10 (threshold: {threshold}).',
            'reasoning': 'Gandalf was absent; the decision was made by weighted average.',
            'feedback': '' if verdict == 'PASS' else 'Please address the council concerns.'
        }
        print(json.dumps(obj))
        ")
        echo "$result" > "$RUNNER_TEMP/verdict.json"

    # ── Post comment ─────────────────────────────────────────────────────
    - name: Format and post review comment
      id: post
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WEIGHTS: ${{ steps.config.outputs.weights }}
      run: |
        bash "${{ github.action_path }}/scripts/format-comment.sh" \
          "$RUNNER_TEMP/reviews" "$RUNNER_TEMP/verdict.json" "$WEIGHTS" > "$RUNNER_TEMP/comment.md"

        PR_NUMBER="${{ steps.diff.outputs.pr-number }}"
        VERDICT=$(jq -r '.verdict // "FAIL"' "$RUNNER_TEMP/verdict.json" | tr '[:lower:]' '[:upper:]')
        SUMMARY=$(jq -r '.summary // ""' "$RUNNER_TEMP/verdict.json")

        echo "decision=$VERDICT" >> "$GITHUB_OUTPUT"
        {
          echo 'summary<<RIVENDELL_EOF'
          echo "$SUMMARY"
          echo 'RIVENDELL_EOF'
        } >> "$GITHUB_OUTPUT"

        gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
          -F body=@"$RUNNER_TEMP/comment.md"
        echo "✅ Review comment posted to PR #$PR_NUMBER"

        if [ "$VERDICT" != "PASS" ]; then
          echo "::error::You shall not pass! The council has rejected this PR."
          exit 1
        fi
