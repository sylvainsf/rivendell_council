# Rivendell Council — Reusable Workflow
#
# Assembles a fellowship of AI code reviewers to evaluate a pull request.
# Each council member reviews the diff in parallel using GitHub Models
# (via actions/ai-inference). Gandalf synthesises all reviews and delivers
# a PASS/FAIL verdict posted as a PR comment.
#
# Usage (in your repository's workflow):
#
#   jobs:
#     council:
#       uses: sylvainsf/rivendell_council/.github/workflows/council.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#         models: read
#       with:
#         model: openai/gpt-4o

name: Rivendell Council

on:
  workflow_call:
    inputs:
      model:
        description: >
          GitHub Models model identifier. Examples: openai/gpt-4o,
          anthropic/claude-sonnet-4.6, openai/gpt-5.4
        type: string
        default: 'openai/gpt-4o'
      max-diff-chars:
        description: 'Maximum characters of the PR diff sent to each reviewer.'
        type: number
        default: 30000
    outputs:
      decision:
        description: "Gandalf's final verdict: PASS or FAIL."
        value: ${{ jobs.gandalf.outputs.decision }}
      summary:
        description: "A prose summary of the council's findings."
        value: ${{ jobs.gandalf.outputs.summary }}

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:

  # ── Fetch the PR diff ────────────────────────────────────────────────────
  prepare:
    name: Fetch PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr-number: ${{ steps.diff.outputs.pr-number }}
    steps:
      - name: Fetch diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CHARS: ${{ inputs.max-diff-chars }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -H "Accept: application/vnd.github.v3.diff" \
            | head -c "$MAX_CHARS" > diff.patch
          SIZE=$(wc -c < diff.patch | tr -d ' ')
          echo "Fetched diff for PR #$PR_NUMBER ($SIZE bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: pr-diff
          path: diff.patch
          retention-days: 1

  # ── Council member reviews (run in parallel) ─────────────────────────────

  review-elrond:
    name: "🌟 Elrond – Correctness"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sylvainsf/rivendell_council
          path: .council

      - uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Build prompt
        run: |
          {
            cat .council/council/Elrond.md
            printf '\n\n---\n\nReview the following pull request diff. '
            printf 'Respond with a JSON object containing: '
            printf '"score" (integer 1-10), "summary" (string), '
            printf '"concerns" (array of strings), "suggestions" (array of strings). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n\n'
            cat diff.patch
          } > prompt.txt

      - uses: actions/ai-inference@v1
        id: review
        with:
          model: ${{ inputs.model }}
          prompt-file: prompt.txt

      - name: Save review
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          if printf '%s' "$REVIEW" | jq . > review.json 2>/dev/null; then
            echo "Parsed JSON review"
          else
            echo "Raw response — wrapping in fallback JSON"
            jq -n --arg raw "$REVIEW" \
              '{"score":5,"summary":"Review could not be parsed as JSON.","concerns":[],"suggestions":[],"raw_response":$raw}' \
              > review.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: review-elrond
          path: review.json
          retention-days: 1

  review-gimli:
    name: "⚔️ Gimli – Strength"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sylvainsf/rivendell_council
          path: .council

      - uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Build prompt
        run: |
          {
            cat .council/council/Gimli.md
            printf '\n\n---\n\nReview the following pull request diff. '
            printf 'Respond with a JSON object containing: '
            printf '"score" (integer 1-10), "summary" (string), '
            printf '"concerns" (array of strings), "suggestions" (array of strings). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n\n'
            cat diff.patch
          } > prompt.txt

      - uses: actions/ai-inference@v1
        id: review
        with:
          model: ${{ inputs.model }}
          prompt-file: prompt.txt

      - name: Save review
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          if printf '%s' "$REVIEW" | jq . > review.json 2>/dev/null; then
            echo "Parsed JSON review"
          else
            jq -n --arg raw "$REVIEW" \
              '{"score":5,"summary":"Review could not be parsed as JSON.","concerns":[],"suggestions":[],"raw_response":$raw}' \
              > review.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: review-gimli
          path: review.json
          retention-days: 1

  review-aragorn:
    name: "👑 Aragorn – Maintainability"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sylvainsf/rivendell_council
          path: .council

      - uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Build prompt
        run: |
          {
            cat .council/council/Aragorn.md
            printf '\n\n---\n\nReview the following pull request diff. '
            printf 'Respond with a JSON object containing: '
            printf '"score" (integer 1-10), "summary" (string), '
            printf '"concerns" (array of strings), "suggestions" (array of strings). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n\n'
            cat diff.patch
          } > prompt.txt

      - uses: actions/ai-inference@v1
        id: review
        with:
          model: ${{ inputs.model }}
          prompt-file: prompt.txt

      - name: Save review
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          if printf '%s' "$REVIEW" | jq . > review.json 2>/dev/null; then
            echo "Parsed JSON review"
          else
            jq -n --arg raw "$REVIEW" \
              '{"score":5,"summary":"Review could not be parsed as JSON.","concerns":[],"suggestions":[],"raw_response":$raw}' \
              > review.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: review-aragorn
          path: review.json
          retention-days: 1

  review-legolas:
    name: "🏹 Legolas – Performance"
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sylvainsf/rivendell_council
          path: .council

      - uses: actions/download-artifact@v4
        with:
          name: pr-diff

      - name: Build prompt
        run: |
          {
            cat .council/council/Legolas.md
            printf '\n\n---\n\nReview the following pull request diff. '
            printf 'Respond with a JSON object containing: '
            printf '"score" (integer 1-10), "summary" (string), '
            printf '"concerns" (array of strings), "suggestions" (array of strings). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n\n'
            cat diff.patch
          } > prompt.txt

      - uses: actions/ai-inference@v1
        id: review
        with:
          model: ${{ inputs.model }}
          prompt-file: prompt.txt

      - name: Save review
        env:
          REVIEW: ${{ steps.review.outputs.response }}
        run: |
          if printf '%s' "$REVIEW" | jq . > review.json 2>/dev/null; then
            echo "Parsed JSON review"
          else
            jq -n --arg raw "$REVIEW" \
              '{"score":5,"summary":"Review could not be parsed as JSON.","concerns":[],"suggestions":[],"raw_response":$raw}' \
              > review.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: review-legolas
          path: review.json
          retention-days: 1

  # ── Gandalf — synthesise and deliver verdict ─────────────────────────────

  gandalf:
    name: "🧙 Gandalf – Final Verdict"
    needs: [prepare, review-elrond, review-gimli, review-aragorn, review-legolas]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      models: read
      pull-requests: write
    outputs:
      decision: ${{ steps.post.outputs.decision }}
      summary: ${{ steps.post.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sylvainsf/rivendell_council
          path: .council

      - uses: actions/download-artifact@v4
        with:
          name: pr-diff

      # Download each review (continue-on-error in case a member job failed)
      - uses: actions/download-artifact@v4
        with:
          name: review-elrond
          path: reviews/elrond
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: review-gimli
          path: reviews/gimli
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: review-aragorn
          path: reviews/aragorn
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: review-legolas
          path: reviews/legolas
        continue-on-error: true

      - name: Build Gandalf prompt
        run: |
          {
            cat .council/council/Gandalf.md
            printf '\n\n---\n\nHere is the pull request diff under review:\n\n'
            cat diff.patch
            printf '\n\n---\n\nHere are the council members'"'"' reviews:\n\n'
            for dir in reviews/*/; do
              [ -d "$dir" ] || continue
              member=$(basename "$dir")
              echo "### $member"
              if [ -f "$dir/review.json" ]; then
                cat "$dir/review.json"
              else
                echo '{"score": 5, "summary": "This member did not submit a review."}'
              fi
              echo ""
            done
            printf '\nDeliver your final verdict. Respond with a JSON object containing: '
            printf '"verdict" ("PASS" or "FAIL"), "summary" (string), '
            printf '"reasoning" (string), "feedback" (string). '
            printf 'Respond with valid JSON only — no markdown fences, no commentary.\n'
          } > gandalf-prompt.txt

      - uses: actions/ai-inference@v1
        id: verdict
        with:
          model: ${{ inputs.model }}
          prompt-file: gandalf-prompt.txt

      - name: Save verdict
        env:
          VERDICT: ${{ steps.verdict.outputs.response }}
        run: |
          if printf '%s' "$VERDICT" | jq . > verdict.json 2>/dev/null; then
            echo "Parsed Gandalf verdict"
          else
            jq -n --arg raw "$VERDICT" \
              '{"verdict":"FAIL","summary":"Gandalf'"'"'s verdict could not be parsed.","reasoning":"Parse error","feedback":"Check the Actions logs.","raw_response":$raw}' \
              > verdict.json
          fi

      - name: Format and post review comment
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
        run: |
          bash .council/scripts/format-comment.sh reviews verdict.json > comment.md

          VERDICT=$(jq -r '.verdict // "FAIL"' verdict.json 2>/dev/null | tr '[:lower:]' '[:upper:]')
          SUMMARY=$(jq -r '.summary // ""' verdict.json 2>/dev/null)

          echo "decision=$VERDICT" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<RIVENDELL_EOF'
            echo "$SUMMARY"
            echo 'RIVENDELL_EOF'
          } >> "$GITHUB_OUTPUT"

          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -F body=@comment.md
          echo "✅ Review comment posted to PR #$PR_NUMBER"

          if [ "$VERDICT" != "PASS" ]; then
            echo "::error::You shall not pass! The council has rejected this PR."
            exit 1
          fi
